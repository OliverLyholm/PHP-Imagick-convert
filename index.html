<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert images</title>
</head>
<body>
    
<form action="upload.php" method="POST" enctype="multipart/form-data">

    <label for="images">Upload Images</label>
    <br>
    <input type="file" multiple id="images" name="uploaded_images[]">
    <br>
    <label for="height">Select full height</label> <br>
    <input type="text" name="imageHeight" id="height"> <br>
    <label for="width">Select full Width</label> <br>
    <input type="text" name="imageWidth" id="width"> <br>

    <label for="centerHeight">Enter center image height</label> <br>
    <input type="text" name="centerImageHeight" id="centerHeight"><br>
    <label for="centerWidth">Enter center image Width</label><br>
    <input type="text" name="centerImageWidth" id="centerWidth"><br>

    <!-- <label for="format">select image format</label> <br>
    <select name="imageFormat" id="format">
        <option value="jpeg">JPEG</option>
        <option value="png">PNG</option>
        <option value="webp">WebP</option>
        <option value="gif">GIF</option>
    </select>
    <br> -->

    <label>Select image formats</label>
    <ul>
        <li>
            <input type="checkbox" name="formats[]" value="jpeg" id="formatjpeg" checked>
            <label for="formatjpeg">JPEG</label>
        </li>

        <li>
            <input type="checkbox" name="formats[]" value="png" id="formatpng">
            <label for="formatpng">PNG</label>
        </li>
        <li>
            <input type="checkbox" name="formats[]" value="webp" id="formatwebp">
            <label for="formatwebp">WebP</label>
        </li>
        <li>
            <input type="checkbox" name="formats[]" value="gif" id="formatgif">
            <label for="formatgif">GIF</label>
        </li>
    </ul>
    

    <label for="compression">Choose image quality</label>
    <input type="range" id="compression" name="compression" min="1" max="100" value="50">   <span id="qualityValue">50</span>
    <br>


    <button type="submit">Send</button>
</form>



<script>
  const slider = document.getElementById("compression");
  const value = document.getElementById("qualityValue");

  slider.addEventListener("input", () => {
    value.textContent = slider.value;
  });
</script>

</body>
</html>
