<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert images</title>
</head>
<body>
    
<form action="upload.php" method="POST" enctype="multipart/form-data">

    <label for="images">Upload Images</label>
    <br>
    <input type="file" multiple id="images" name="uploaded_images[]">
    <br>
    <label for="height">Select height</label> <br>
    <input type="text" name="imageHeight" id="height"> <br>
    <label for="width">Select Width</label> <br>
    <input type="text" name="imageWidth" id="width"> <br>

    <label for="format">select image format</label> <br>
    <select name="imageFormat" id="format">
        <option value="jpeg">JPEG</option>
        <option value="png">PNG</option>
        <option value="webp">WebP</option>
        <option value="gif">GIF</option>
    </select>
    <br>
    <label for="compression">Choose JPEG quality</label>
    <input type="range" id="compression" name="compression" min="0" max="100" value="50">   <span id="qualityValue">50</span>
    <br>


    <button type="submit">Send</button>
</form>



<script>
  const slider = document.getElementById("compression");
  const value = document.getElementById("qualityValue");

  slider.addEventListener("input", () => {
    value.textContent = slider.value;
  });
</script>

</body>
</html>
